name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'space/**'
      - '!space/assets/**'    # asset changes are always manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push space/ to Hugging Face (UI files only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # clone the existing HF Space so LFS files are already there
          git clone https://phkeil:$HF_TOKEN@huggingface.co/spaces/phkeil/s1000-diagnoser hf_space
          cd hf_space

          # overlay UI files from this repo — never touch assets/
          rsync -av --exclude='assets/' ../space/ .

          git config user.email "deploy@github-actions"
          git config user.name "GitHub Actions"
          git add .
          git diff --cached --quiet && echo "Nothing to deploy" && exit 0
          git commit -m "deploy UI from ${{ github.sha }}"
          git push