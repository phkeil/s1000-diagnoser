[tool.ruff.lint]
# Ruff 0.16's no-config default enables ~415 rules (confirmed empirically, not
# just the classic E4/E7/E9/F). Most of the extras (UP: pyupgrade, PLR: pylint
# refactor suggestions, ...) are style opinions, not bugs - and would demand
# rewriting code that was deliberately extracted verbatim from the source
# notebooks (see src/model.py, src/data.py docstrings). Pin to the classic,
# meaningful set: pyflakes (F) + basic pycodestyle errors (E4/E7/E9).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Without this, `tests/` (no __init__.py) becomes pytest's sys.path insertion
# point instead of the repo root, so `from src...` imports fail with
# ModuleNotFoundError when running bare `pytest` (only `python -m pytest`
# happened to work, because -m adds the cwd to sys.path itself).
pythonpath = ["."]
testpaths = ["tests"]
