name: s1000-diagnoser
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel
  - pip:
    - torch==2.11.0
    - torchvision==0.26.0
    - pyyaml==6.0.3
    - librosa>=0.10.0,<0.11.0
    - numpy>=1.24.0,<3.0.0
    - scipy>=1.10.0,<2.0.0
    - matplotlib>=3.7.0,<4.0.0
    - pandas>=2.0.0,<3.0.0
    - pillow==12.1.1
    - scikit-learn==1.8.0
    - mlflow==3.16.0
    - pytest==9.1.1
    # ONNX export toolchain (src/export_onnx.py) - dev-only, deliberately NOT in
    # requirements-api.txt: the Docker inference image serves the PyTorch model
    # directly and never exports. onnxscript is required by torch 2.11's default
    # (dynamo) torch.onnx.export path; onnxruntime is used to verify the export.
    - onnx==1.22.0
    - onnxscript==0.7.2
    - onnxruntime==1.30.0
